<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 40 40" xml:space="preserve">
  <defs>
    <linearGradient id="ici-navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A4D9C"/>
      <stop offset="100%" stop-color="#0A1F44"/>
    </linearGradient>
  </defs>
  <!-- Rounded navy square background -->
  <rect x="2" y="2" width="36" height="36" rx="9" fill="url(#ici-navy-grad)"/>
  <!-- Gold accent bar (ICI signature) -->
  <rect x="2" y="29" width="36" height="3" fill="#FFB700"/>
  <!-- Graduation cap — white + gold tassel (ICI "E-Class" motif) -->
  <g transform="translate(20, 17)">
    <!-- Mortarboard top (diamond) -->
    <polygon points="-10,-3 0,-8 10,-3 0,2" fill="#FFFFFF"/>
    <!-- Cap base -->
    <path d="M -6,0 L -6,4 Q 0,7 6,4 L 6,0 L 0,3 Z" fill="#FFFFFF" opacity="0.92"/>
    <!-- Gold tassel -->
    <line x1="9" y1="-3" x2="9" y2="5" stroke="#FFB700" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="9" cy="6.2" r="1.8" fill="#FFB700"/>
  </g>
</svg>
